# FF — Weekly Fundamentals Check
# ==================================
# Scrapes the latest quarterly results and merges them into the corrected
# fundamentals base the signal engine reads.

name: Weekly Fundamentals Check

on:
  schedule:
    - cron: '30 4 * * 0'        # 10:00 IST Sunday
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fundamentals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas lxml numpy

      - name: Scrape latest fundamentals from Screener
        run: |
          python FF_Fixed_Gemini_Scraper.py --tickers tickers.txt --output fundamentals_master.csv
          if [ -s failed_tickers_gemini.txt ]; then
            echo "Retrying failed tickers..."
            python FF_Fixed_Gemini_Scraper.py --tickers failed_tickers_gemini.txt --output fundamentals_retry.csv || true
            python merge_retry.py
          fi

      # Replaces FF_fundamentals_ingest.py, which wrote fund_flags.csv - the
      # pre-v3 format, with no positivity filter and a 4-quarter window for
      # Micro Cap. Nothing reads that file any more, so the base it maintained
      # had become a dead end while the engine read a frozen snapshot.
      - name: Merge into the v3 fundamentals base
        run: python FF_fundamentals_ingest_v3.py

      # A new quarter must not break the reproduction. If it does, something is
      # wrong with the ingest and the base should not be committed.
      - name: Signal engine acceptance test
        run: python FF_Signal_Engine_v2.py --verify FF_FINAL_v5_n500.csv

      - name: Commit and push updated fundamentals
        run: |
          git config user.name "FF Automation"
          git config user.email "actions@github.com"
          # Add only what exists. corporate_actions.csv is written by the NSE
          # bhavcopy updater, which is not wired yet, so it is legitimately
          # absent -- and naming an absent path makes git add exit 128 and takes
          # the whole run down AFTER the scrape, the merge and the acceptance
          # test have all succeeded. That is exactly what happened on 27 Sep:
          # 32 minutes of good work discarded at the last line.
          #
          # daily_update.yml was given this loop weeks ago for the same file and
          # the same reason. This workflow was left on the old list, so the fix
          # covered the instance and not the class. It now covers both.
          for f in fund_flags_v3.csv fundamentals_master.csv corporate_actions.csv; do
            if [ -e "$f" ]; then git add "$f"; else echo "absent, not added: $f"; fi
          done
          git diff --quiet --cached || git commit -m "Weekly fundamentals check: $(date +'%Y-%m-%d')"
          git pull --rebase --autostash origin main
          git push
